# Cada vez que subes cambios a la rama main:
#   1) se revisa el código (HTML válido, sin scripts inline, sin claves expuestas)
#   2) solo si todo pasa, se publica en https://ackermanjpg.github.io
# Si algo falla verás una ❌ roja en GitHub y la versión anterior sigue en línea.
name: Revisar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar HTML
        run: npx --yes html-validate@9 "*.html"
      - name: Revisar JavaScript
        run: for f in js/*.js; do node --check "$f"; done
      - name: Revisar que no haya scripts inline (romperían la CSP)
        run: |
          if grep -nE '<script>|<script [^>]*>[^<]+' *.html | grep -v 'application/ld+json' | grep -v 'src='; then
            echo "Hay JavaScript inline. Muévelo a js/." && exit 1
          fi
      - name: Revisar que no haya claves secretas
        run: |
          if grep -rnEi '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"'][^"'"'"']{8,}' --include=*.js --include=*.html .; then
            echo "Posible secreto en el código." && exit 1
          fi
      - name: Preparar archivos del sitio
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml .nojekyll css js img .well-known _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: revisar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
